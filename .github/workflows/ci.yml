name: CI

"on": [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run unit tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Check shell syntax
        run: |
          # sh parses only the first script argument; check the others separately.
          sh -n adaptive-poll.sh install.sh uninstall.sh
          sh -n install.sh
          sh -n uninstall.sh
